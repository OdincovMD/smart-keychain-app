name: smart_keychain_app
description: Offline-first companion app for a playful smart keychain display.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  clock: ^1.1.2
  drift: ^2.34.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  image: ^4.9.2
  image_picker: ^1.2.3
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/scenes/
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
          weight: 500
        - asset: assets/fonts/Unbounded.ttf
          weight: 600
        - asset: assets/fonts/Unbounded.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
          weight: 400
        - asset: assets/fonts/Manrope.ttf
          weight: 500
        - asset: assets/fonts/Manrope.ttf
          weight: 600
        - asset: assets/fonts/Manrope.ttf
          weight: 700
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
          weight: 600
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans.ttf
          weight: 700
